<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Buchstaben nachspuren (Druckschrift Nord)</title>
    <!-- Einbindung der didaktischen Schulschrift Andika (Druckschrift-Konform) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #007AFF;
            --bg: #f2f5f9;
            --card: #ffffff;
            --text: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: 'Andika', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .nav-back {
            align-self: flex-start;
            text-decoration: none;
            color: var(--primary);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            touch-action: manipulation;
        }

        .setup-container {
            background: var(--card);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            margin-top: 10px;
            touch-action: manipulation;
        }

        .setup-container h2 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-option {
            flex: 1 1 calc(50% - 8px);
            padding: 12px 6px;
            border: 2px solid #d1d1d6;
            background: #fff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-option.active {
            border-color: var(--primary);
            background: #e3f2fd;
            color: var(--primary);
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border: 2px solid #d1d1d6;
            border-radius: 12px;
            outline: none;
            display: none;
            font-family: 'Andika', sans-serif;
        }

        .custom-input:focus {
            border-color: var(--primary);
        }

        .btn-start {
            width: 100%;
            background: #34C759;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
            margin-top: 10px;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        .exercise-area {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .exercise-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            touch-action: manipulation;
        }

        .nav-btn {
            background-color: #e5e5ea;
            border: none;
            font-size: 22px;
            font-weight: bold;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:active {
            background-color: #d1d1d6;
        }

        .letter-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            text-align: center;
            flex: 1;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border: 2px solid #e5e5ea;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #guide-canvas { z-index: 1; }
        #draw-canvas { z-index: 2; cursor: crosshair; }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            touch-action: manipulation;
        }

        .color-group {
            display: flex;
            gap: 8px;
            background: white;
            padding: 6px 12px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .color-btn.active {
            border-color: #1c1c1e;
            transform: scale(1.1);
        }

        .btn-action {
            padding: 12px 18px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-clear { background: #ff3b30; color: white; }
        .btn-settings { background: #e5e5ea; color: var(--text); }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← Zurück zur Übersicht</a>

    <div class="setup-container" id="setup-screen">
        <h2>✍️ Schuldruckschrift nachspuren</h2>

        <div class="form-group">
            <label>Auswahl:</label>
            <div class="btn-group" id="mode-group">
                <button type="button" class="btn-option active" onclick="setMode('upper', this)">Nur Groß (A-Z)</button>
                <button type="button" class="btn-option" onclick="setMode('lower', this)">Nur Klein (a-z)</button>
                <button type="button" class="btn-option" onclick="setMode('all', this)">Alle (A-Z & a-z)</button>
                <button type="button" class="btn-option" onclick="setMode('custom', this)">Eigenes Wort / Name</button>
            </div>
        </div>

        <div class="form-group" id="custom-box">
            <label>Wort oder Name eingeben (z. B. Mina):</label>
            <input type="text" class="custom-input" id="custom-text" placeholder="z. B. Mina">
        </div>

        <button class="btn-start" onclick="startSpuren()">Starten ▶</button>
    </div>

    <div class="exercise-area" id="exercise-screen">
        <div class="exercise-header">
            <button class="nav-btn" id="btn-prev" onclick="prevLetter()">◀</button>
            <h1 class="letter-title" id="letter-title">Buchstabe A</h1>
            <button class="nav-btn" id="btn-next" onclick="nextLetter()">▶</button>
        </div>

        <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="guide-canvas"></canvas>
            <canvas id="draw-canvas"></canvas>
        </div>

        <div class="toolbar">
            <div class="color-group">
                <div class="color-btn active" style="background:#007aff;" onclick="setColor('#007aff', this)"></div>
                <div class="color-btn" style="background:#34c759;" onclick="setColor('#34c759', this)"></div>
                <div class="color-btn" style="background:#ff9500;" onclick="setColor('#ff9500', this)"></div>
                <div class="color-btn" style="background:#af52de;" onclick="setColor('#af52de', this)"></div>
            </div>

            <button class="btn-action btn-clear" onclick="clearDrawCanvas()">Neu</button>
            <button class="btn-action btn-settings" onclick="backToSetup()">⚙️ Setup</button>
        </div>
    </div>

<script>
    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const LOWER = "abcdefghijklmnopqrstuvwxyz".split("");
    const ALL = [...UPPER, ...LOWER];

    let currentMode = 'upper';
    let lettersList = [];
    let currentIndex = 0;
    let customWord = "";
    let currentColor = '#007aff';
    const STROKE_WIDTH = 18;

    const guideCanvas = document.getElementById('guide-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const guideCtx = guideCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('#mode-group .btn-option').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('custom-text').style.display = mode === 'custom' ? 'block' : 'none';
    }

    function startSpuren() {
        // Sicherstellen, dass die Schulschrift vor dem Zeichnen geladen ist
        document.fonts.load('bold 100px "Andika"').then(() => {
            if (currentMode === 'custom') {
                customWord = document.getElementById('custom-text').value.trim();
                if (!customWord) {
                    alert('Bitte ein Wort oder einen Namen eingeben!');
                    return;
                }
                document.getElementById('btn-prev').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
            } else {
                document.getElementById('btn-prev').style.display = 'flex';
                document.getElementById('btn-next').style.display = 'flex';

                if (currentMode === 'upper') lettersList = [...UPPER];
                else if (currentMode === 'lower') lettersList = [...LOWER];
                else if (currentMode === 'all') lettersList = [...ALL];
                currentIndex = 0;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('exercise-screen').style.display = 'flex';

            resizeCanvases();
            renderExercise();
        });
    }

    function backToSetup() {
        document.getElementById('exercise-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function resizeCanvases() {
        guideCanvas.width = wrapper.clientWidth;
        guideCanvas.height = wrapper.clientHeight;
        drawCanvas.width = wrapper.clientWidth;
        drawCanvas.height = wrapper.clientHeight;
    }

    function renderExercise() {
        const w = guideCanvas.width;
        const h = guideCanvas.height;
        guideCtx.clearRect(0, 0, w, h);

        // Grundschul-Lineatur:
        // Oberlinie (Dach), Mittellinie (Erdgeschoss-Decke), Grundlinie (Boden), Unterlinie (Keller)
        const lineTop = h * 0.22;
        const lineMid = h * 0.46;
        const lineBase = h * 0.70;
        const lineBottom = h * 0.90;

        guideCtx.lineWidth = 2;

        // Ober- und Unterlinie (dezent grau)
        guideCtx.strokeStyle = '#e0e0e0';
        guideCtx.beginPath();
        guideCtx.moveTo(20, lineTop); guideCtx.lineTo(w - 20, lineTop);
        guideCtx.moveTo(20, lineBottom); guideCtx.lineTo(w - 20, lineBottom);
        guideCtx.stroke();

        // Mittellinie gestrichelt
        guideCtx.strokeStyle = '#c7c7cc';
        guideCtx.setLineDash([8, 8]);
        guideCtx.beginPath();
        guideCtx.moveTo(20, lineMid); guideCtx.lineTo(w - 20, lineMid);
        guideCtx.stroke();
        guideCtx.setLineDash([]);

        // Grundlinie (kräftiger hervorgehoben)
        guideCtx.strokeStyle = '#8e8e93';
        guideCtx.lineWidth = 3;
        guideCtx.beginPath();
        guideCtx.moveTo(20, lineBase); guideCtx.lineTo(w - 20, lineBase);
        guideCtx.stroke();

        guideCtx.textBaseline = 'alphabetic';

        if (currentMode === 'custom') {
            document.getElementById('letter-title').innerText = `Wort: ${customWord}`;
            drawWordGuide(customWord, w, lineBase);
        } else {
            const letter = lettersList[currentIndex];
            document.getElementById('letter-title').innerText = `Buchstabe ${letter} (${currentIndex + 1}/${lettersList.length})`;
            drawSingleGuide(letter, w / 2, lineBase);
        }

        clearDrawCanvas();
    }

    function drawSingleGuide(letter, x, baseY) {
        const fontSize = 165;
        guideCtx.font = `bold ${fontSize}px 'Andika', sans-serif`;
        guideCtx.textAlign = 'center';

        // Heller Untergrund
        guideCtx.fillStyle = '#ebedf2';
        guideCtx.fillText(letter, x, baseY);

        // Gestrichelte Führungslinie
        guideCtx.strokeStyle = '#7c7c82';
        guideCtx.lineWidth = 5;
        guideCtx.setLineDash([12, 10]);
        guideCtx.strokeText(letter, x, baseY);
        guideCtx.setLineDash([]);
    }

    function drawWordGuide(word, width, baseY) {
        const chars = word.split('');
        const numChars = chars.length;

        // Großzügige Abstände (Spacing) zwischen den Buchstaben
        const availableWidth = width - 80;
        const letterSpacing = Math.max(35, Math.min(65, availableWidth / (numChars * 1.8)));
        
        let fontSize = Math.min(140, Math.floor(availableWidth / (numChars * 0.95)));
        fontSize = Math.max(65, fontSize);

        guideCtx.font = `bold ${fontSize}px 'Andika', sans-serif`;

        // Gesamtbreite berechnen
        let totalWidth = 0;
        const charWidths = chars.map(ch => {
            const w = guideCtx.measureText(ch).width;
            totalWidth += w;
            return w;
        });
        totalWidth += (numChars - 1) * letterSpacing;

        // Wort horizontal zentrieren
        let currentX = (width - totalWidth) / 2;
        guideCtx.textAlign = 'left';

        chars.forEach((ch, idx) => {
            // Heller Untergrund
            guideCtx.fillStyle = '#ebedf2';
            guideCtx.fillText(ch, currentX, baseY);

            // Gestrichelte Führungskontur
            guideCtx.strokeStyle = '#7c7c82';
            guideCtx.lineWidth = Math.max(3.5, fontSize * 0.04);
            guideCtx.setLineDash([10, 8]);
            guideCtx.strokeText(ch, currentX, baseY);
            guideCtx.setLineDash([]);

            currentX += charWidths[idx] + letterSpacing;
        });
    }

    function nextLetter() {
        if (currentMode !== 'custom' && currentIndex < lettersList.length - 1) {
            currentIndex++;
            renderExercise();
        }
    }

    function prevLetter() {
        if (currentMode !== 'custom' && currentIndex > 0) {
            currentIndex--;
            renderExercise();
        }
    }

    function clearDrawCanvas() {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    function setColor(col, btn) {
        currentColor = col;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Touch-Zeichenlogik
    let drawing = false;
    let lx = 0, ly = 0;

    function getCoords(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDraw(e) {
        e.preventDefault();
        drawing = true;
        const pos = getCoords(e);
        lx = pos.x;
        ly = pos.y;

        drawCtx.beginPath();
        drawCtx.arc(lx, ly, STROKE_WIDTH / 2, 0, Math.PI * 2);
        drawCtx.fillStyle = currentColor;
        drawCtx.fill();
    }

    function moveDraw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getCoords(e);

        drawCtx.beginPath();
        drawCtx.moveTo(lx, ly);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.strokeStyle = currentColor;
        drawCtx.lineWidth = STROKE_WIDTH;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.stroke();

        lx = pos.x;
        ly = pos.y;
    }

    function stopDraw() {
        drawing = false;
    }

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    drawCanvas.addEventListener('touchend', stopDraw);
    drawCanvas.addEventListener('touchcancel', stopDraw);

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', moveDraw);
    drawCanvas.addEventListener('mouseup', stopDraw);
    drawCanvas.addEventListener('mouseleave', stopDraw);

    window.addEventListener('resize', () => {
        if (document.getElementById('exercise-screen').style.display === 'flex') {
            resizeCanvases();
            renderExercise();
        }
    });
</script>
</body>
</html>
