<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lernwerkstatt – Übersicht</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #636366;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .header p {
            font-size: 16px;
            color: var(--text-sub);
            margin: 0;
        }

        .grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border: 2px solid transparent;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card:active {
            transform: scale(0.98);
            background-color: #f9f9fb;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.18);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            background: #fff3e0;
            color: #FF9500;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
            line-height: 1.3;
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎲 Mathe-Lernwerkstatt</h1>
        <p>Tippe auf das Feld, um zu starten:</p>
    </div>

    <div class="grid">
        <a href="MA-1bis6.html" class="card">
            <div class="icon-box">🎲</div>
            <div class="card-content">
                <span class="card-title">Zahlen & Punkte</span>
                <span class="card-desc">Finde die passenden Paare (Zahlenraum bis 6)</span>
            </div>
        </a>
    </div>

    <div class="footer">
        100% offline & datenschutzkonform • iPad-optimiert
    </div>

</body>
</html>
